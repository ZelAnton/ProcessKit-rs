name: mutants

# cargo-mutants exhaustively mutates the examined modules (scope defined in
# .cargo/mutants.toml, which cargo-mutants auto-loads from the workspace root)
# and re-runs the whole test suite for every mutant, which is far too slow and
# noisy to gate a PR — even over a small, hermetic scope a full sweep can take
# tens of minutes. Like the stress and fuzz tiers, it stays OUTSIDE the PR
# matrix: nightly on a schedule and on-demand via the Actions tab.
#
# Why this tier is sharded (T-103)
# --------------------------------
# The hermetic scope currently yields ~400 mutants. A single un-parameterized
# `cargo mutants` job processed only ~60 of them in ~59 min (43 MISSED, 19
# TIMEOUT) before the hosted runner was reclaimed ("runner has received a
# shutdown signal") — an end-to-end rate of ~1 min/mutant. That rate bundles the
# per-mutant incremental build + full test run, plus the configured auto-timeout
# (at least 30 s, and 6x the baseline test time) that each hang-inducing mutant
# (~1 in 3 here) burns in full. Sweeping all 400 at
# ~1 min each needs several hours, so the single job never reached a verdict: it
# blew past both `timeout-minutes: 90` and the wall-clock the runner actually
# grants, and every scheduled run 2026-07-08..2026-07-11 ended cancelled/failed
# mid-sweep (run 29144347707 was the latest).
#
# Fix: split the mutant list across an 8-way matrix using cargo-mutants' native
# `--shard k/8`. Sharding deterministically partitions the SAME ~400 mutants
# (same .cargo/mutants.toml scope, same auto-timeout) into 8 disjoint subsets of
# ~50 — it does NOT narrow the scope and does NOT shrink the per-mutant timeout,
# so total mutation coverage is unchanged and no real MISSED mutant can be
# hidden by this change. Only the parallelism changes.
#
# Budget per shard (observed ~1 min/mutant end-to-end, applied pessimistically):
#
#     one unmutated baseline build + test, paid once per shard runner
#         ~2 min warm cache … ~10 min cold cache (first sharded run)
#   + ~50 mutants × ~1 min                                       ≈ 50 min
#   ------------------------------------------------------------------------
#     ≈ 52 min warm  …  ≈ 60 min cold, worst case, per shard
#
# i.e. ~52–60 min against the per-job `timeout-minutes: 90` below — a ~30–38 min
# (≈1.5–1.7×) headroom that absorbs runner variance, versus the old single job
# that could not finish at all. If the scope in .cargo/mutants.toml grows enough
# that ~400 mutants climbs and erodes this headroom, raise the shard count in the
# matrix below (keep the `--shard k/N` denominator in step).
#
# Single overall verdict, and what "green" means (T-129)
# ------------------------------------------------------
# `fail-fast: false` runs every shard to its own verdict. A shard is green iff
# cargo-mutants reports ZERO MISSED mutants for its subset. TIMEOUT mutants are
# tolerated and do NOT red the shard: a TIMEOUT means the mutation made the code
# hang (e.g. breaks the pump's loop-advance / termination signal — offset
# arithmetic in `next_terminator`, `start += term.resume`,
# `SharedLines::{close,close_now,changed}`, `pump_lines_core -> ()`, and similar)
# rather than fail a test. Such a mutant cannot be "caught" — it hangs by
# construction — so cargo-mutants' configured auto-timeout (at least 30 s, and
# 6x the baseline test time), not a real test failure,
# is what flags it, and treating that as a red is not a useful signal.
#
# The run step below decides success/failure from cargo-mutants' actual output
# files (`mutants.out/missed.txt` / `timeout.txt`), NOT from its exit code:
# exit 3 can mean "some MISSED and some TIMEOUT" simultaneously (observed: shard
# 4/8, 2 missed + 12 timeouts, exit 3), so naively treating exit 3 as tolerable
# would hide real MISSED mutants. TIMEOUT-ed mutants stay visible (logged and
# added to the job summary), never silently dropped. There is deliberately no
# YAML-level `continue-on-error`; the step itself captures cargo-mutants' exit
# code and only tolerates the "some TIMEOUT, zero MISSED" case — any other
# non-zero exit (build/setup failure, unexpected cargo-mutants error) still reds
# the shard, so a failure/hang stays visible.
#
# Trade-off (deliberate, accepted): tolerating TIMEOUT could in principle mask a
# real coverage gap if the test that WOULD have caught a mutant is itself slow
# enough to time out instead of failing outright. Mitigation: .cargo/mutants.toml
# explicitly sets `timeout_multiplier = 6` and `minimum_test_timeout = 30`, so
# cargo-mutants allows the greater of 6x the measured baseline test time or 30 s
# before declaring TIMEOUT. That leaves a genuine test failure room to fire
# before the auto-timeout, while the per-shard budget above (≤90 min) retains
# ample headroom.
#
# Full mutation coverage (closing the real MISSED gaps observed on this scope)
# is a separate follow-up; this change only fixes what counts as a false alarm.
#
# A shard whose runner is reclaimed mid-sweep (T-130)
# ---------------------------------------------------
# Separately from the MISSED/TIMEOUT verdict logic above, one shard (observed:
# 5/8, on 3 independent runs 2026-07-17..2026-07-18, each interrupted ~6 min in —
# far inside timeout-minutes: 90 and inside cargo-mutants' own ~30-38 s per-mutant
# auto-timeout) does not reach a verdict at all: its GitHub-hosted runner is
# reclaimed out from under a well-behaved process —
#
#     ERROR interrupted
#     ##[error]The runner has received a shutdown signal. ...
#     ##[error]The operation was canceled.
#
# This is an INFRASTRUCTURE-level reclaim, a failure class distinct from a red
# shard. GitHub cancels the reclaimed job, so its conclusion is `cancelled`, NOT
# the `failure` that the verdict step below produces via `exit 1` on a real
# MISSED. That `cancelled` vs `failure` split is the entire basis of the safe
# auto-retry (see the mitigation note below).
#
# Root cause (investigated; a pre-existing instability, not a regression):
#   * The first of the three runs predates T-128/T-129 entirely (it used the old
#     exit-code step) and hit the identical shard-5/8 pattern — so neither task
#     introduced it.
#   * NOT timeout-minutes (dies ~6 min; budget is 90) and NOT cargo-mutants'
#     per-mutant auto-timeout (the message is a hosted-runner reclaim, not a
#     cargo-mutants TIMEOUT verdict; TIMEOUT handling stays correct in the other
#     7 shards).
#   * The tempting "a mutated Linux process-lifecycle function (sys::imp /
#     running) leaks orphan child processes and destabilises the runner"
#     hypothesis is ruled OUT by the actual mutation scope. .cargo/mutants.toml
#     limits examine_globs to five hermetic pure-logic modules (pump/buffer/
#     retry/result/error) AND exclude_globs `src/sys/**`, `src/running/**`,
#     `src/supervisor.rs`, so NO mutant is ever generated in the process-spawning
#     layer. `cargo mutants --list --shard 5/8` confirms it: every mutant in that
#     shard is in those five files, none under sys/running. (The benign
#     `WARN referent of mod not found mod_name=imp` in the log is cargo-mutants
#     parsing the `mod imp;` declaration in src/sys/mod.rs, not mutating sys::imp
#     — see KB K-009.) There is therefore no in-scope code defect to fix here.
#   * What remains is a transient hosted-runner reclaim (an infra flake and/or
#     resource churn from the full test suite that cargo-mutants re-runs per
#     mutant, which does spawn real subprocesses). Pinning the exact trigger
#     would need a multi-hour sweep on the CI-pinned Linux toolchain (K-006/
#     K-009) — out of scope on a Windows host, and moot: the reclaim happens
#     before any verdict, so there is no coverage gap to repair, only a lost job
#     to re-run.
#
# Mitigation (accepted interim): a companion controller, the workflow
# .github/workflows/mutants-retry.yml, watches this workflow's completion and
# re-runs — from a clean checkout on a fresh runner — ONLY shard jobs whose
# conclusion is `cancelled`, never `failure`. A step-level retry here (a bash
# loop / retry-action inside the shard step) cannot help: the runner itself is
# being torn down, so the retry code would die with it — only a fresh job on a
# fresh runner recovers. Because a real MISSED verdict is `failure`, it is
# structurally impossible for this retry to paper over a coverage gap: the
# retried shard either reaches a genuine verdict (green, or a real MISSED red
# that stays red) or is reclaimed again and, after a small bounded number of
# attempts, stays visibly unresolved. Retrying is safe precisely because the
# failure happens before cargo-mutants reaches any verdict — there is nothing to
# hide.
#
# Trade-off (deliberate, accepted): a runner genuinely lost to a transient infra
# event is retried automatically (the goal), at the cost of also retrying a shard
# cancelled for some other reason while its siblings still reached verdicts. The
# controller therefore refuses to retry when the WHOLE run is cancelled (the
# manual-/whole-run-cancel shape) and caps attempts to avoid re-run loops. This
# only auto-retries; it cannot by itself PROVE the reclaim is gone — that is
# confirmed by observing a later schedule/workflow_dispatch run reach a verdict
# on the affected shard (the T-130 follow-up observation point).
on:
  schedule:
    # 05:29 UTC daily — staggered from stress.yml (03:17) and fuzz.yml (04:07).
    - cron: '29 5 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: mutants (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # Generous per-shard ceiling: each shard is estimated at ~52–60 min (see the
    # budget note above), so 90 min is a ~1.5× backstop that still hard-fails a
    # pathologically slow shard instead of letting it hang the whole tier.
    timeout-minutes: 90
    strategy:
      # Run every shard to its own verdict; one red shard already reds the run.
      fail-fast: false
      matrix:
        # 8-way split of the ~400-mutant scope (see the header note). Grow this
        # list — and the `--shard k/N` denominator below — together if the mutant
        # count rises enough to erode the per-shard headroom.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-mutants
      # Scope, exclusions and `--all-features` all come from .cargo/mutants.toml
      # (auto-loaded by cargo-mutants); `--shard k/8` is the only CLI parameter,
      # selecting this job's disjoint subset of that fixed scope.
      #
      # Verdict is decided from mutants.out/{missed,timeout}.txt, not from
      # cargo-mutants' exit code (see the header comment for why): a non-empty
      # missed.txt is a real coverage gap and reds the shard; a non-empty
      # timeout.txt alone is tolerated but still surfaced in the log and job
      # summary. Any exit code other than the recognised "clean" (0) or
      # "missed/timeout accounted for" (2/3) cases reds the shard too, so an
      # unrelated cargo-mutants/setup failure can't slip through silently.
      - name: Run mutants shard
        run: |
          set +e
          cargo mutants --shard ${{ matrix.shard }}/8
          status=$?
          set -e

          missed_file="mutants.out/missed.txt"
          timeout_file="mutants.out/timeout.txt"

          # Exit 2/3 are mutant-outcome verdicts only when cargo-mutants wrote
          # the matching files. A crash or interrupted run must stay red.
          if [ "$status" -eq 3 ] && [ ! -s "$timeout_file" ]; then
            echo "::error::cargo-mutants exited 3 in shard ${{ matrix.shard }}/8 without a non-empty timeout.txt — treating incomplete output as a hard failure"
            exit 1
          fi

          if [ "$status" -eq 2 ] && [ ! -s "$missed_file" ] && [ ! -s "$timeout_file" ]; then
            echo "::error::cargo-mutants exited 2 in shard ${{ matrix.shard }}/8 without a non-empty missed.txt or timeout.txt — treating incomplete output as a hard failure"
            exit 1
          fi

          if [ -s "$timeout_file" ]; then
            count=$(wc -l < "$timeout_file" | tr -d ' ')
            echo "::warning::${count} mutant(s) timed out in shard ${{ matrix.shard }}/8 (tolerated — hang-by-construction, not a MISSED signal; see workflow header)"
            echo "--- timeout.txt (shard ${{ matrix.shard }}/8, tolerated) ---"
            cat "$timeout_file"
            {
              echo "### TIMEOUT mutants (tolerated) — shard ${{ matrix.shard }}/8"
              echo '```'
              cat "$timeout_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s "$missed_file" ]; then
            count=$(wc -l < "$missed_file" | tr -d ' ')
            echo "::error::${count} mutant(s) MISSED in shard ${{ matrix.shard }}/8 — real coverage gap"
            echo "--- missed.txt (shard ${{ matrix.shard }}/8) ---"
            cat "$missed_file"
            {
              echo "### MISSED mutants — shard ${{ matrix.shard }}/8"
              echo '```'
              cat "$missed_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ] && [ "$status" -ne 3 ]; then
            echo "::error::cargo-mutants exited ${status} in shard ${{ matrix.shard }}/8 for a reason other than mutant outcomes (no MISSED, mutants.out/missed.txt empty/absent) — treating as a hard failure, not tolerating"
            exit "$status"
          fi

          echo "Shard ${{ matrix.shard }}/8: no MISSED mutants (cargo-mutants exit code was ${status}; TIMEOUT-only outcomes are tolerated per policy — see workflow header)."
