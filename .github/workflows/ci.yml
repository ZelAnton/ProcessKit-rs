name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a new push doesn't queue behind stale CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Lint on every OS so each platform module is actually checked: cgroup /
      # process-group (Linux), Job Object (Windows) and the macOS/BSD process
      # group (macOS). Linting only on Linux would leave windows.rs and unix.rs
      # unchecked. `ubuntu-24.04-arm` lints the same Linux module on aarch64.
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # All three feature configurations must stay warning-clean: minimal
      # (no features), default (process-control only — stats/limits opt-in), and
      # everything.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings

  hack:
    name: feature-powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      # The clippy/test matrix exercises three FIXED feature configs
      # (no-default / default / all). With 6 features, combinations the fixed set
      # never builds — `limits` without `stats`, `record` alone —
      # can break compilation undetected. `--feature-powerset --depth 2` checks
      # every ≤2-feature combination, catching feature-gate mistakes
      # the fixed configs miss. Platform-specific `sys/` gates stay covered by the
      # 3-OS clippy matrix; this runs on Linux for the feature dimension only.
      - run: cargo hack --feature-powerset --depth 2 check --all-targets

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # macOS exercises the POSIX process-group containment path (unix.rs); the
      # BSDs use the same path but have no hosted runner, so macOS stands in.
      # `ubuntu-24.04-arm`: the only leg that actually runs the native Linux
      # syscall/layout code (sys/{linux,pgroup,unix,pid_gate}.rs) on aarch64 —
      # the msrv job only `cargo check`s aarch64-apple-darwin, which is Darwin
      # and never executes on real Linux/glibc-aarch64.
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--all-features` so the feature-gated tests (stats, limits) still run now
      # that `limits` is off by default.
      - run: cargo build --all-targets --all-features
      # `--include-ignored` runs the real-subprocess tests too, so kill-on-drop is
      # actually exercised on each OS — including the macOS process-group teardown.
      # This step's doctest pass is also where every `docs/*.md` guide's and the
      # root `README.md`'s fenced Rust blocks get compiler-checked (T-047): the
      # hidden `src/doc_examples.rs` harness only builds under `--all-features`
      # (the guides collectively exercise every optional feature). Note
      # `--include-ignored` still *compiles* an `ignore`-tagged doc block (only
      # `no_run` skips running it, and only a non-`rust` fence like `text` skips
      # compiling it) — see `docs/upgrading.md` for the historical-API snippets
      # that use `text` for exactly that reason.
      - run: cargo test --all-features -- --include-ignored
      # Also exercise the default configuration (process-control only — stats and
      # limits off) at runtime: it takes the `limits`-free `Job::new()` path — the
      # one every default consumer runs — which `--all-features` alone never executes.
      - run: cargo test -- --include-ignored
      # And the bare core (no default features): clippy/doc only compile this
      # configuration — running its tests guards the lean runtime path (and the
      # cfg-gated arms in the suite) against bit-rot.
      - run: cargo test --no-default-features -- --include-ignored

  test-musl:
    name: test (musl/Alpine)
    runs-on: ubuntu-latest
    # `rust:alpine` is real Alpine Linux — musl libc and a busybox userland —
    # with Rust preinstalled via rustup for the musl target. Every leg above
    # exercises only glibc (`ubuntu-latest`) or a non-Linux OS; musl is the
    # de-facto standard for the container images this crate will actually run
    # in, and its libc/signal/userland details genuinely differ from glibc's.
    # Running inside the container (rather than merely cross-compiling to the
    # `x86_64-unknown-linux-musl` target on an ubuntu runner) is deliberate:
    # it exercises the real busybox `sh`/coreutils the real-subprocess tests
    # spawn, not just musl-linked object code executed by glibc userland tools.
    container:
      image: rust:alpine
      # `--init`: a plain container has no subreaper as PID 1 (PID 1 here is
      # just this job's own entry process) — a killed process's orphaned
      # grandchildren become unreaped zombies that still probe alive via
      # `kill(pid, 0)`, which falsely fails every containment test that forks
      # grandchildren (`unix_fork_storm_is_swept_by_group_broadcast`,
      # `per_stage_timeout_reaps_a_forking_stages_grandchild`,
      # `unix_setsid_child_forks_grandchild_still_contained` — confirmed by
      # running the suite locally with and without this flag). `--init` runs
      # tini as PID 1, a real subreaper, matching how a properly configured
      # container host behaves.
      # `--cap-add=SYS_NICE`: Docker drops CAP_SYS_NICE from the default
      # capability set even for a root container user, so raising scheduling
      # priority fails EPERM regardless of uid.
      # `priority_high_with_uid_drop_and_no_groups_succeeds` raises priority
      # (`Priority::High` -> negative nice) — confirmed to need exactly this
      # capability locally. Restored explicitly rather than skipping the test:
      # it is a narrow, low-blast-radius capability (only lets a process raise
      # its own/children's scheduling priority), unlike e.g. `SYS_ADMIN`.
      options: --init --cap-add=SYS_NICE
    steps:
      # The image has neither `git` (actions/checkout needs it) nor a `ps`
      # that supports `-p PID` (busybox's `ps` only takes a fixed `-o` column
      # list, no `-p` filter; `priority_and_umask_apply_before_exec` needs
      # that filter) — installed via `procps` (procps-ng), which apk swaps in
      # over the busybox applet. Everything else the suite spawns (`sh`,
      # `cat`, `sleep`, `yes`, `head`, `grep`, `sort`, `id`, `printf`, `env`,
      # `seq`) is already covered by Alpine's busybox — confirmed by running
      # the full suite locally against this image with only these two
      # packages added. `gcc`/`musl-dev` (needed to link) already ship in the
      # base image.
      - name: Install git and procps (ps -p support)
        run: apk add --no-cache git procps
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
      # Same three feature configurations as the `test` job above, each with
      # `--include-ignored` so the real-subprocess/kill-on-drop tests run.
      - run: cargo test --all-features -- --include-ignored
      - run: cargo test -- --include-ignored
      - run: cargo test --no-default-features -- --include-ignored

  loom:
    name: loom (model check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The harness has its own manifest/lockfile under `loom/`.
          workspaces: loom
      # Exhaustively model-check the three historically race-prone PID-lifecycle
      # lock-free protocols — the `pid_gate` linearization, the deadline
      # `PENDING -> TIMED_OUT`/`EXITED` arbiter CAS, and the `SkipDropKill` re-arm
      # latch (archive: T-064/066/078/079/082/092/093). This runs in the standalone
      # `loom/` harness, which depends only on loom and `#[path]`-includes the three
      # pure cores from `src/`: the parent crate itself can't build under `--cfg loom`
      # because tokio strips `tokio::process` there (loom can't model real I/O).
      # `--cfg loom` flips `src/sync.rs` to loom's atomics/mutex and selects each
      # core's `#[cfg(all(test, loom))]` suite; the tokio/libc parts are
      # `#[cfg(not(loom))]`-gated out. `--release` keeps loom's interleaving search
      # fast. One Linux leg suffices — the modeled protocols are platform-agnostic.
      # `--lib`: run only the harness's unit tests (the loom suites). It carries no
      # doctests, and `cargo test`'s doctest phase drives rustdoc, which doesn't get
      # `RUSTFLAGS` — so it would rebuild the cores in their `not(loom)` shape and
      # fail on the tokio/libc parts. `--lib` skips that phase cleanly.
      - name: Model-check with loom
        working-directory: loom
        run: cargo test --release --lib -- --nocapture
        env:
          RUSTFLAGS: --cfg loom

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # `--all-features` so the feature-gated stats/limits code counts towards
      # coverage; `--include-ignored` so the real-subprocess tests (most of the
      # suite) run instead of being silently skipped.
      #
      # Collected on Linux only: `sys/windows.rs` (Job Objects) and the macOS
      # branch of `sys/unix.rs` (process groups on BSD/macOS) never execute
      # here, so the reported percentage is a Linux-only lower bound, not a
      # whole-crate figure. The `test` job above still runs the full suite
      # (`--include-ignored`) on all three OSes — this job only adds line
      # coverage, not additional platform exercising.
      - run: cargo llvm-cov --all-features --lcov --output-path lcov.info -- --include-ignored
      # Tolerate failure here, not above: a real `cargo llvm-cov` failure
      # (broken build, failing test) must still fail this job and be visible.
      # Only the upload itself is allowed to fail — until this repository is
      # connected to coveralls.io (a one-time external setup this code doesn't
      # control), this step fails every run, which would otherwise turn the
      # whole workflow-run conclusion red and defeat the CI badge this task adds.
      - name: Upload coverage to Coveralls
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: lcov.info

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The crate's docs are intra-doc-link dense; a broken link degrades the
      # docs.rs page silently (doctests don't catch it). Build both the
      # docs.rs configuration (all features) and the minimal one.
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings
      # docs.rs builds on nightly with `--cfg docsrs` (activating
      # `feature(doc_cfg)` for the per-item "Available on feature X" badges).
      # The stable builds above leave that attribute inert, so they would NOT
      # catch a docs.rs-only break (a renamed/removed nightly feature, a bad
      # doc(cfg)). Build the docs.rs way too, so such a break fails here instead
      # of silently degrading the published page.
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo +nightly doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  typos:
    name: spell check (typos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Catches common typos across README/docs/rustdoc before they reach
      # docs.rs or the published mdBook site; lychee above only checks that
      # links resolve, it doesn't check spelling. Config/allow-list lives in
      # `_typos.toml`; `just typos` runs the same check locally.
      - uses: crate-ci/typos@v1

  linkcheck:
    name: markdown links (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The crate's docs are cross-linked (README/ARCHITECTURE/ROADMAP/docs/*.md);
      # doc-rich but nothing else checks that those links actually resolve —
      # `doc` above only compiles rustdoc's intra-doc links.
      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        env:
          # Authenticated GitHub API requests get a much higher rate limit,
          # avoiding flaky 429s on the many github.com links in these docs.
          # No secret beyond the workflow's own token is required.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # `.lychee.toml` excludes `ideas/`/`decisions/`: those dirs are
          # deliberately untracked by git (see the Cargo.toml `exclude`
          # comment), so links to them 404 on GitHub even though they resolve
          # locally for checkout-based readers.
          args: >-
            --config .lychee.toml
            --cache --max-cache-age 2d
            --no-progress
            README.md ARCHITECTURE.md ROADMAP.md docs
          fail: true

  audit:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Scan the dependency tree for security advisories, banned/duplicate
      # crates, and licenses outside the permissive allow-list (deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses

  minimal-versions:
    name: direct-minimal-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # Re-resolve every direct dependency down to the lowest SemVer-compatible
      # version (indirect dependencies still resolve normally) and build against
      # that resolution, in a throwaway lockfile — the committed Cargo.lock (built
      # with normal, highest-version resolution) is untouched. Catches a
      # `foo = "1.0"` declaration that actually needs `1.0.5`'s API, which the
      # committed lockfile's higher pin would otherwise mask indefinitely.
      - run: cargo +nightly -Z direct-minimal-versions generate-lockfile
      - run: cargo +nightly check --all-targets --all-features --locked

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Verify the crate still builds on its declared Minimum Supported Rust
      # Version. Keep `toolchain` in sync with `rust-version` in Cargo.toml.
      # (`@master` + the `toolchain` input accepts a two-component "1.88"; the
      # version-branch refs require a full patch version like `@1.88.0`.)
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: x86_64-pc-windows-msvc, aarch64-apple-darwin
      # rust-toolchain.toml tracks stable and would otherwise win here; remove it
      # so cargo uses the 1.88 toolchain installed above and truly tests the floor.
      - run: rm -f rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      # `--all-features` so the feature-gated stats/limits code is held to the
      # same MSRV floor as the default build.
      - run: cargo check --all-targets --all-features
      # Cross-`check` the other platform modules against the same floor: this
      # Linux job alone never compiles windows.rs (Job Objects) or unix.rs
      # (macOS/BSD pgroup), so a newer-than-MSRV API there would slip through.
      # `check` doesn't link, so no foreign linkers are needed. Scoped to
      # `--lib --bins` (not `--all-targets`): that still covers windows.rs/unix.rs
      # via `--lib`, but skips benches/examples/tests. `--tests` is excluded too,
      # not just benches/examples: even under `check`, compiling the `tests`
      # target still resolves and builds the crate's dev-dependency closure
      # (criterion -> alloca), and alloca's build script needs a real C
      # toolchain, which this Linux runner doesn't have for these cross targets.
      - run: cargo check --target x86_64-pc-windows-msvc --lib --bins --all-features
      - run: cargo check --target aarch64-apple-darwin --lib --bins --all-features

  public-api:
    name: public-api diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # cargo-public-api builds its diff from rustdoc JSON, which is only
      # available on nightly (the `-Z unstable-options --output-format json`
      # rustdoc flag isn't stabilized). Without this, the job would fail on
      # every run for a toolchain reason, not on actual API drift.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked
      # Real gate: the crate is past 1.0, so any public-surface change is a
      # deliberate, reviewable act — it must come with an updated `public-api.txt`
      # in the same PR. A stale baseline fails this job instead of silently
      # drifting from what's actually exported.
      - name: Diff public API vs baseline
        run: |
          cargo +nightly public-api --simplified --all-features > /tmp/current-api.txt
          echo "=== Changes to the public API surface vs public-api.txt ==="
          diff public-api.txt /tmp/current-api.txt && echo "(no changes)"

  semver-checks:
    name: cargo-semver-checks (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-semver-checks
      # Informational only while the crate works towards its next major: the
      # surface is still expected to break intentionally, and a hard SemVer gate
      # would just fail on every deliberate breaking change. Flip
      # `continue-on-error` to `false` once the major lands, so this starts
      # blocking accidental breaking changes on the following minor/patch line.
      - name: Check SemVer compatibility vs published baseline
        continue-on-error: true
        run: cargo semver-checks
