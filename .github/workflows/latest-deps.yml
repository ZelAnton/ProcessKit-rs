name: latest dependencies

# The ordinary CI matrix intentionally consumes the committed Cargo.lock. This
# separate tier re-resolves every allowed dependency range so an upstream release
# that breaks library consumers is visible before the next lockfile update.
on:
  schedule:
    # 05:37 UTC daily -- staggered after the 03:17/04:07 heavy scheduled tiers.
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always

jobs:
  latest-deps:
    name: latest-deps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # These two legs cover the cgroup/process-group and Job Object backends;
      # the job is an early-warning tier rather than another full five-OS CI run.
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9
      # The checkout is disposable, so updating this lockfile cannot mutate the
      # committed graph. Running this before rust-cache keys the cache to the
      # freshly resolved versions rather than the repository snapshot.
      - name: Resolve latest allowed dependencies
        run: cargo update
      - uses: Swatinem/rust-cache@v2
      - name: Show resolved direct dependency graph
        run: cargo tree --depth 1
      - name: Build
        run: cargo build --all-targets --all-features
      # Serialize this early-warning tier: parallel PowerShell/process startup can
      # exhaust a hosted runner and create false teardown timeouts. The ordinary
      # matrix still runs four isolated tests at a time.
      - name: Test
        run: cargo nextest run --profile ci-all --all-features --run-ignored all --test-threads 1
      - name: Test doctests
        if: ${{ !cancelled() }}
        run: cargo test --all-features --doc
      - name: Publish nextest report
        if: ${{ !cancelled() && hashFiles('target/nextest/ci-all/junit.xml') != '' }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: target/nextest/ci-all/junit.xml
          check_name: nextest latest-deps (${{ matrix.os }})
      - name: Upload nextest report
        if: ${{ !cancelled() && hashFiles('target/nextest/ci-all/junit.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: nextest-latest-deps-${{ matrix.os }}
          path: target/nextest/ci-all/junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --all-features -- -D warnings
