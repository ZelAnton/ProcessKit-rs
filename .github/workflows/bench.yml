name: bench

# benches/pump.rs measures output decoding, line splitting, and buffering with real child processes.
# Shared runner load makes these measurements too variable for a PR gate.
# This workflow runs weekly against main and on manual dispatch against the selected ref.
# Criterion compares results with the previous baseline and produces an HTML report.
# The cache and retained artifact store target/criterion without a separate history service.
# Additional benchmark suites or alert thresholds can require a different reporting tool.
on:
  schedule:
    # Saturday at 04:37 UTC separates this start from stress and fuzz.
    - cron: '37 4 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: bench (pump)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Persists criterion's own `target/criterion` baseline directory across
      # runs so `--save-baseline main` below has something to compare
      # against and prints a regressed/improved delta into the job log. The
      # cache key includes the run id, so it never hits an exact match --
      # actions/cache then always saves the freshly written baseline at the
      # end of the job, and the next run picks it up via `restore-keys`,
      # keeping the entry rolling forward run over run.
      - uses: actions/cache@v6
        with:
          path: target/criterion
          key: criterion-pump-${{ github.run_id }}
          restore-keys: |
            criterion-pump-
      # Artifacts preserve the baseline when caches expire between weekly runs.
      - name: Restore retained Criterion baseline
        run: bash tools/restore_scheduled_artifact.sh criterion-pump-report target/criterion
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # Single OS (ubuntu-latest): the benched code (line splitting/decoding
      # in the shared pump) isn't platform-specific, and comparing baselines
      # run-over-run only makes sense if every run comes from the same kind
      # of machine -- mixing runners would show up as noise, not signal.
      - run: cargo bench --bench pump -- --save-baseline main
      # The HTML report (plots, per-benchmark stats) isn't visible from the
      # job log alone -- upload it so a regression can be inspected visually,
      # not just read off the printed percentage change.
      - name: Upload criterion report
        uses: actions/upload-artifact@v7
        with:
          name: criterion-pump-report
          path: target/criterion
          retention-days: 30
          overwrite: true
