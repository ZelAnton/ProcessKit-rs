[book]
title = "processkit"
authors = ["Anton Zhelezniakou"]
description = "Async child-process management for tokio: whole-tree kill-on-drop (no orphans), plus streaming, pipelines, timeouts, and supervision"
language = "en"
# Reuse docs/*.md as-is (no copy/duplication) — README.md is the intro page,
# SUMMARY.md is the mdBook-only index file that drives the sidebar.
src = "docs"

[output.html]
git-repository-url = "https://github.com/ZelAnton/ProcessKit-rs"
# `{path}` is relative to `book.src` ("docs"), so prefix it back on to land on
# the real repo path.
edit-url-template = "https://github.com/ZelAnton/ProcessKit-rs/edit/main/docs/{path}"
